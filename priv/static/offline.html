<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF4C00" />
    <meta name="robots" content="noindex" />
    <title>You are offline · Komiuta</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family: "Lufga", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        font-weight: 700;
      }
      .card {
        width: 100%;
        max-width: 480px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 32px;
        padding: 40px 28px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
      }
      img { height: 44px; width: auto; margin-bottom: 28px; }
      .eyebrow {
        color: #ff4c00;
        font-size: 11px;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        margin: 0 0 14px;
      }
      h1 { font-size: 28px; line-height: 1.1; letter-spacing: -0.03em; margin: 0 0 12px; }
      p { color: #64748b; font-size: 14px; line-height: 1.6; margin: 0 0 28px; }
      .actions { display: flex; flex-direction: column; gap: 10px; }
      button, a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 14px 20px;
        border-radius: 999px;
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        border: 1px solid transparent;
      }
      button { background: #ff4c00; color: #ffffff; box-shadow: 0 10px 24px rgba(255, 76, 0, 0.25); }
      button:hover { background: #e64400; }
      a { background: #ffffff; color: #334155; border-color: #e2e8f0; }
      a:hover { border-color: #ff4c00; color: #ff4c00; }
      .hint { margin: 26px 0 0; font-size: 11px; color: #94a3b8; letter-spacing: 0.06em; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/images/logo_brand.png" alt="Komiuta" />
      <p class="eyebrow">No connection</p>
      <h1>You're offline</h1>
      <p>
        Komiuta needs a connection to search buses, load tickets and take payments.
        Check your network and try again — your bookings are safe.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Try again</button>
        <a href="/">Back to booking</a>
      </div>
      <p class="hint">Tip: add Komiuta to your home screen for faster access.</p>
    </main>
  </body>
</html>
